ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    // Consuming apps that define `kotlin_version` in their root build.gradle win;
    // otherwise use the version the native Ezoic SDK is built with.
    ezoicKotlinVersion = project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.0.21'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.0.21'}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.ezoic.capacitor"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.13.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // Native Ezoic Ads SDK (resolved from Maven Central). Brings in Google Mobile
    // Ads + Prebid transitively. Requires mavenCentral() + google() in the
    // consuming app's repositories (the Capacitor template provides both).
    implementation "com.ezoic.sdk:ezoic-ads-sdk:1.13.0"

    // The native-ad template references GMA's NativeAdView/MediaView/NativeAd
    // types at compile time. The Ezoic SDK POM scopes Google Mobile Ads at
    // runtime only, so pin the compile-time classpath here (runtime resolution
    // still comes transitively from the Ezoic SDK).
    compileOnly "com.google.android.gms:play-services-ads:22.6.0"

    testImplementation "junit:junit:$junitVersion"
}
