name: Publish to npm

# Publishes @ezoic/capacitor-sdk (repo root) and @ezoic/capacitor-cmp-sdk
# (cmp/) to npm from one tag, using npm Trusted Publishing (OIDC).
# No NPM_TOKEN is involved: GitHub Actions proves its identity to npm with a
# short-lived OIDC token, which npm verifies against the Trusted Publisher
# configured for each package on npmjs.com.
#
# Prerequisites (one-time, for EACH of the two packages):
#   1. The package must already exist on npm (npm has no "pending publisher").
#      Create it with one manual bootstrap publish of a THROWAWAY version,
#      never the real release version, then deprecate it:
#        cd cmp   # (or the repo root for @ezoic/capacitor-sdk)
#        npm version 0.0.1-bootstrap.0 --no-git-tag-version --ignore-scripts
#        npm publish --access public --tag bootstrap --ignore-scripts
#        npm deprecate @ezoic/capacitor-cmp-sdk@0.0.1-bootstrap.0 "Bootstrap placeholder; do not use."
#        git checkout package.json
#      (npm may stage the publish for 2FA approval on npmjs.com first.) While
#      the CMP package is missing, the preflight step below publishes the ads
#      package alone; a missing ads package fails the run before anything is
#      published.
#   2. On npmjs.com -> the package -> Settings -> Trusted Publisher, add a
#      GitHub Actions publisher with EXACTLY:
#        Organization or user: ezoic
#        Repository:           capacitor-sdk
#        Workflow filename:    publish.yml
#        Environment name:     release
#      All fields are case-sensitive; a mismatch fails publish with E404.
#      The job below sets `environment: release` so the OIDC claim matches.
#
# Release: bump both package versions (package.json, cmp/package.json), pin
# the iOS framework sha256s (`node scripts/fetch-ios-sdk.js --pin`), then push
# a matching SemVer tag, e.g.
#   git tag v1.13.0 && git push origin v1.13.0
# or run this workflow manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the npm Trusted Publisher config.
    environment: release
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Caching is intentionally disabled for release builds.

      # Fail fast if a tag push doesn't match package.json, so we never try to
      # (re)publish a mismatched or already-published version.
      - name: Verify tag matches both package.json versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in package.json cmp/package.json; do
            PKG_VERSION="$(node -p "require('./$pkg').version")"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match $pkg version $PKG_VERSION"
              exit 1
            fi
          done

      # Trusted publishing requires npm >= 11.5.1. Node 24 ships a compatible
      # npm, but pin to latest to be safe.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run verify:web

      # The pods vendor these from the npm tarballs. Fails on a sha256 that is
      # still the TODO-RELEASE placeholder or that doesn't match the release.
      - name: Fetch and verify the iOS frameworks
        run: |
          node scripts/fetch-ios-sdk.js
          node scripts/fetch-ios-sdk.js --check
          node scripts/fetch-ios-sdk.js --dest cmp/ios/Frameworks --only EzoicConsentCoreBinary,EzoicCmpSDKBinary
          node scripts/fetch-ios-sdk.js --dest cmp/ios/Frameworks --only EzoicConsentCoreBinary,EzoicCmpSDKBinary --check

      # Trusted publishing can't create a package, so a missing one would fail
      # its publish after the other package was already out. Check both first.
      # npm can't attach a Trusted Publisher to a package that doesn't exist
      # yet. The ads package must exist. The CMP package is optional: the ads
      # package doesn't depend on it, so while it is missing this run publishes
      # the ads package alone and warns. Once the CMP package is bootstrapped,
      # re-run this workflow on the same tag (`gh workflow run publish.yml
      # --ref vX.Y.Z`); the ads package is then skipped as already published.
      - name: Preflight (packages exist on npm)
        id: preflight
        run: |
          if [ -z "$(npm view @ezoic/capacitor-sdk name 2>/dev/null)" ]; then
            echo "::error::@ezoic/capacitor-sdk does not exist on npm; nothing was published (see the header of this workflow)."
            exit 1
          fi
          if [ -n "$(npm view @ezoic/capacitor-cmp-sdk name 2>/dev/null)" ]; then
            echo "cmp=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::@ezoic/capacitor-cmp-sdk does not exist on npm yet, so this run publishes @ezoic/capacitor-sdk only. Do its one-time bootstrap publish and add its Trusted Publisher (see the header of this workflow), then re-run this workflow on the same tag."
            echo "cmp=false" >> "$GITHUB_OUTPUT"
          fi

      # `prepublishOnly` rebuilds dist/ during publish. Provenance is generated
      # automatically for OIDC publishes from a public repo; the flag makes the
      # intent explicit. A version already on npm (a re-run after a partial
      # publish) is skipped. The CMP goes first: the ads pod depends on it at
      # the same version when an app installs both.
      #
      # A failed CMP publish doesn't block the ads package: the ads package
      # doesn't depend on the CMP package on npm, and the usual cause is a
      # missing or mismatched Trusted Publisher (E404), which only an npm org
      # admin can fix. Fix it, then re-run this workflow on the same tag.
      - name: Publish @ezoic/capacitor-cmp-sdk
        if: steps.preflight.outputs.cmp == 'true'
        working-directory: cmp
        continue-on-error: true
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "@ezoic/capacitor-cmp-sdk@$VERSION" version 2>/dev/null)" ]; then
            echo "@ezoic/capacitor-cmp-sdk@$VERSION is already published; skipping"
          elif ! npm publish --provenance --access public; then
            echo "::error::@ezoic/capacitor-cmp-sdk@$VERSION was not published (E404 = its npm Trusted Publisher is missing or doesn't match; see the header of this workflow). Continuing with @ezoic/capacitor-sdk; re-run this workflow on the same tag once it's fixed."
            exit 1
          fi

      - name: Publish @ezoic/capacitor-sdk
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "@ezoic/capacitor-sdk@$VERSION" version 2>/dev/null)" ]; then
            echo "@ezoic/capacitor-sdk@$VERSION is already published; skipping"
          else
            npm publish --provenance --access public
          fi
